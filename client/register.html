<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — CareerPredict AI</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="nav-brand">
        <span class="brand-icon">⚡</span>
        <span>CareerPredict <span style="color:var(--primary);">AI</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="/" class="nav-link">Home</a></li>
        <li><a href="/about.html" class="nav-link">About</a></li>
        <li><a href="/model.html" class="nav-link">Model</a></li>
      </ul>
      <div class="nav-actions">
        <a href="/login.html" class="btn btn-secondary btn-sm">Log In</a>
      </div>
    </div>
  </header>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-logo">⚡</div>
        <h1>Create Account</h1>
        <p class="text-muted">Start predicting and analyzing your career trajectory</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="register-name" class="form-label">Full Name</label>
          <input type="text" id="register-name" class="form-control" placeholder="e.g. Alex Johnson" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="register-email" class="form-label">Email Address</label>
          <input type="email" id="register-email" class="form-control" placeholder="you@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="register-password" class="form-label">Password</label>
          <input type="password" id="register-password" class="form-control" placeholder="Minimum 6 characters" required autocomplete="new-password" minlength="6">
        </div>

        <div class="form-group">
          <label for="register-confirm-password" class="form-label">Confirm Password</label>
          <input type="password" id="register-confirm-password" class="form-control" placeholder="Re-enter password" required autocomplete="new-password">
        </div>

        <div style="font-size:0.775rem; color:var(--text-muted); margin-bottom:1.25rem; line-height:1.4;">
          By registering, you acknowledge that predictions are educational estimates generated by our trained machine learning model.
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary btn-block btn-lg">
          Create Account
        </button>
      </form>

      <div class="auth-divider">OR</div>

      <div class="auth-footer">
        Already have an account? <a href="/login.html" style="font-weight:700; color:var(--primary);">Sign in here →</a>
      </div>
    </div>
  </main>

  <script src="/js/supabase.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
